name: Tourism Package MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-mlops-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:

  # ----------------------------------------------------------
  # 1. Registering and validating the raw dataset
  # ----------------------------------------------------------

  data-registration:
    name: Data Registration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Validate registered dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------
  # 2. Preparing reproducible train and test datasets
  # ----------------------------------------------------------

  data-preparation:
    name: Data Preparation
    needs: data-registration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Run data preparation
        run: python tourism_project/model_building/prep.py

      - name: Upload prepared data splits
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            tourism_project/data/processed/train.csv
            tourism_project/data/processed/test.csv
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------
  # 3. Training, tuning, tracking, and evaluating the model
  # ----------------------------------------------------------

  model-training:
    name: Model Training and Tracking
    needs: data-preparation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: tourism_project/data/processed

      - name: Train and evaluate models
        run: python tourism_project/model_building/train.py

      - name: Upload trained deployment model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            tourism_project/deployment/tourism_model.joblib
            tourism_project/deployment/feature_schema.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload MLflow and evaluation artefacts
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            tourism_project/model_artifacts
            tourism_project/mlruns
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------
  # 4. Testing and publishing validated deployment artefacts
  # ----------------------------------------------------------

  deployment-validation:
    name: Automated Deployment Validation
    needs: model-training
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: tourism_project/deployment

      - name: Download prepared data for testing
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: tourism_project/data/processed

      - name: Validate Streamlit application syntax
        run: |
          python -m py_compile tourism_project/deployment/app.py

      - name: Run automated tests
        run: |
          mkdir -p tourism_project/test-results
          python -m pytest tourism_project/tests \
            --verbose \
            --junitxml=tourism_project/test-results/pytest.xml

      - name: Upload automated test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-results
          path: tourism_project/test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated deployment artefacts
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            tourism_project/deployment/tourism_model.joblib \
            tourism_project/deployment/feature_schema.json

          if git diff --cached --quiet; then
            echo "No deployment artefact changes to commit."
          else
            git commit -m "Update validated tourism model [skip ci]"
            git push
          fi
